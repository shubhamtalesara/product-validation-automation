<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitor Ad Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eef2ff;
    --badge: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #edeef0;
      --muted: #9ca3af;
      --border: #262a33;
      --accent: #60a5fa;
      --accent-soft: #1e293b;
      --badge: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .sheet-link {
    display: inline-block; margin-top: 12px; padding: 8px 16px;
    background: var(--accent); color: white; text-decoration: none;
    border-radius: 8px; font-size: 0.9rem; font-weight: 600;
  }
  .competitor-section { margin-top: 36px; }
  .competitor-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
  .competitor-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .competitor-sub a { color: var(--accent); }
  .error-banner {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    .error-banner { background: #3f1d1d; border-color: #7f1d1d; color: #fca5a5; }
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .media { width: 100%; aspect-ratio: 1.2; background: var(--badge); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .media img { width: 100%; height: 100%; object-fit: cover; }
  .media .video-badge { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 8px; }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .rank-badge {
    font-size: 0.7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px; align-self: flex-start; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .headline { font-weight: 700; font-size: 0.98rem; line-height: 1.3; }
  .copy {
    color: var(--muted); font-size: 0.85rem; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .badge { font-size: 0.75rem; background: var(--badge); color: var(--text); padding: 3px 8px; border-radius: 6px; }
  .spacer { flex: 1; }
  .lp-link {
    font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .lp-link:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 12px 0; }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Competitor Ad Dashboard</h1>
      <div class="meta" id="updated"></div>
    </div>
  </header>
  <div id="sheet-link-container"></div>
  <div id="content"></div>
  <footer>Auto-updated by the scheduled GitHub Action. Approve creatives in the Google Sheet.</footer>
</div>

<script>
function fmtNumber(n) {
  if (n === null || n === undefined || n === "") return "—";
  const num = Number(n);
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(num);
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderCard(ad) {
  const isVideo = (ad.mediaType || "").toLowerCase() === "video";
  const mediaHtml = isVideo
    ? `<div class="video-badge">▶ Video ad<br><a class="lp-link" href="${escapeHtml(ad.mediaUrl)}" target="_blank" rel="noopener">Watch</a></div>`
    : ad.mediaUrl
      ? `<img src="${escapeHtml(ad.mediaUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;video-badge&quot;>No preview</span>'" />`
      : `<span class="video-badge">No preview</span>`;

  return `
    <div class="card">
      <div class="media">${mediaHtml}</div>
      <div class="card-body">
        ${ad.rank ? `<span class="rank-badge">Rank #${escapeHtml(ad.rank)}</span>` : ""}
        <div class="headline">${escapeHtml(ad.headline || "(no headline)")}</div>
        <div class="copy">${escapeHtml(ad.primaryText || "")}</div>
        <div class="stats">
          <span class="badge">👁 ${fmtNumber(ad.reach)} impressions</span>
          <span class="badge">📅 ${ad.daysRunning ?? "—"}d running</span>
          ${ad.cta ? `<span class="badge">${escapeHtml(ad.cta)}</span>` : ""}
        </div>
        <div class="spacer"></div>
        ${ad.landingPageUrl ? `<a class="lp-link" href="${escapeHtml(ad.landingPageUrl)}" target="_blank" rel="noopener">View their landing page →</a>` : ""}
      </div>
    </div>`;
}

function renderCompetitor(c) {
  const adsHtml = c.ads.length
    ? `<div class="grid">${c.ads.map(renderCard).join("")}</div>`
    : `<div class="empty">No ads found yet.</div>`;
  const errorHtml = c.error ? `<div class="error-banner">${escapeHtml(c.error)}</div>` : "";
  return `
    <section class="competitor-section">
      <div class="competitor-title">${escapeHtml(c.name)}</div>
      <div class="competitor-sub"><a href="${escapeHtml(c.landingPage)}" target="_blank" rel="noopener">${escapeHtml(c.landingPage)}</a></div>
      ${errorHtml}
      ${adsHtml}
    </section>`;
}

async function main() {
  const el = document.getElementById("content");
  try {
    const res = await fetch("./data.json?_=" + Date.now());
    if (!res.ok) throw new Error("data.json not found yet");
    const data = await res.json();

    document.getElementById("updated").textContent = data.generatedAt
      ? "Last updated: " + new Date(data.generatedAt).toLocaleString()
      : "";

    if (data.sheetUrl) {
      document.getElementById("sheet-link-container").innerHTML =
        `<a class="sheet-link" href="${escapeHtml(data.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet →</a>`;
    }

    el.innerHTML = data.competitors.map(renderCompetitor).join("");
  } catch (err) {
    el.innerHTML = `<div class="error-banner">
      No data yet. Run the "Sync competitor ads" GitHub Action once (Actions tab → Sync competitor ads → Run workflow),
      then refresh this page.<br><br><code>${escapeHtml(err.message)}</code>
    </div>`;
  }
}
main();
</script>
</body>
</html>
